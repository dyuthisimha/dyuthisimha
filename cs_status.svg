<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 82" width="100%" role="img" aria-label="Live status terminal">
  <style>
    .card {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5;
    }
    .tab {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
    }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .filename {
      font-family: 'Fira Code', 'Cascadia Code', 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #8b949e;
    }
    .divider {
      stroke: #30363d;
      stroke-width: 1;
    }
    .prompt {
      font-family: 'Fira Code', 'Cascadia Code', 'Courier New', Courier, monospace;
      font-size: 13px;
      fill: #3fb950;
    }
    .line-text {
      font-family: 'Fira Code', 'Cascadia Code', 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #c9d1d9;
    }
    .label-building { fill: #3fb950; font-weight: 700; }
    .label-learning { fill: #58a6ff; font-weight: 700; }
    .label-exploring { fill: #d29922; font-weight: 700; }
    .label-solving { fill: #bc8cff; font-weight: 700; }

    .status-1 { animation: cycle1 12s infinite ease-in-out; }
    .status-2 { animation: cycle2 12s infinite ease-in-out; }
    .status-3 { animation: cycle3 12s infinite ease-in-out; }
    .status-4 { animation: cycle4 12s infinite ease-in-out; }

    @keyframes cycle1 {
      0% { opacity: 0; transform: translateY(4px); }
      4% { opacity: 1; transform: translateY(0px); }
      21% { opacity: 1; transform: translateY(0px); }
      25% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes cycle2 {
      0%, 25% { opacity: 0; transform: translateY(4px); }
      29% { opacity: 1; transform: translateY(0px); }
      46% { opacity: 1; transform: translateY(0px); }
      50% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 50% { opacity: 0; transform: translateY(4px); }
      54% { opacity: 1; transform: translateY(0px); }
      71% { opacity: 1; transform: translateY(0px); }
      75% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @keyframes cycle4 {
      0%, 75% { opacity: 0; transform: translateY(4px); }
      79% { opacity: 1; transform: translateY(0px); }
      96% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-4px); }
    }

    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .tab { fill: #f6f8fa; stroke: #d0d7de; }
      .filename { fill: #57606a; }
      .divider { stroke: #d0d7de; }
      .line-text { fill: #24292f; }
    }
  </style>

  <!-- Terminal window -->
  <rect class="card" x="1" y="1" width="698" height="72" rx="10" />

  <!-- Title bar -->
  <path class="tab" d="M11,1 H689 A10,10 0 0 1 699,11 V35 H1 V11 A10,10 0 0 1 11,1 Z" />
  <line class="divider" x1="1" y1="35" x2="699" y2="35" />

  <circle class="dot-red" cx="22" cy="18" r="5" />
  <circle class="dot-yellow" cx="40" cy="18" r="5" />
  <circle class="dot-green" cx="58" cy="18" r="5" />
  <text class="filename" x="350" y="22" text-anchor="middle">~/dyuthi/status.sh</text>

  <!-- Prompt -->
  <text class="prompt" x="24" y="58">❯</text>

  <!-- Animated content lines -->
  <g class="status-1">
    <text class="line-text" x="42" y="58">
      <tspan class="label-building">⚡ building</tspan><tspan> — AI Personal Schedule Assistant (AWS AgentCore)</tspan>
    </text>
  </g>

  <g class="status-2">
    <text class="line-text" x="42" y="58">
      <tspan class="label-learning">📚 learning</tspan><tspan> — systems fundamentals, cloud &amp; full-stack</tspan>
    </text>
  </g>

  <g class="status-3">
    <text class="line-text" x="42" y="58">
      <tspan class="label-exploring">🔬 exploring</tspan><tspan> — RAG architectures, agent workflows &amp; CTFs</tspan>
    </text>
  </g>

  <g class="status-4">
    <text class="line-text" x="42" y="58">
      <tspan class="label-solving">🧩 solving</tspan><tspan> — data structures &amp; algorithms</tspan>
    </text>
  </g>
</svg>
